# Auto-generated by scripts/generate_config.py — do not edit by hand.
# Full config options and type annotations: medcvr_il/common/config_schema.py
#   TopicConfig, ImagePreprocessorConfig, SynchSubscriberNodeConfig,
#   RecorderConfig, InferenceConfig, DataConversionConfig
# '???' marks required fields with no default.

# ==============================================================
# topics   (recorder | lerobot_eval_ros2 | data_conversion)
# Add as many named topic entries as needed (e.g. cam0, cam1, joint_state, ...).
#   recorder, inference, and pre_processor are all optional per topic:
#   - recorder:     set this to include the topic in recorder.py data collection
#   - inference:    set this to include the topic as a policy observation in lerobot_eval_ros2.py
#   - pre_processor: per-topic image crop/resize override (falls back to global_image_pre_processor)
# ==============================================================
topics:
  <topic_key>:
    name: ???
    # ROS message type string, e.g. "sensor_msgs/Image".
    type: ???
    recorder:
      file: null
      folder: null
    inference:
      observation_name: ???
      policy_targets: null
    pre_processor:
      rectangular_crop_hw: null
      image_resize_hw:
      - 240
      - 320
      align: null

# ==============================================================
# global_image_pre_processor   (lerobot_eval_ros2 | data_conversion)
# Applied to image topics that have no per-topic pre_processor.
# ==============================================================
global_image_pre_processor:
  rectangular_crop_hw: null
  image_resize_hw:
  - 240
  - 320
  align: null

# ==============================================================
# synchronizer   (recorder | lerobot_eval_ros2)
# ==============================================================
synchronizer:
  slop_sec: 0.1

# ==============================================================
# recorder   (recorder)
# ==============================================================
recorder:
  frequency: 30.0
  episode: 0
  data_writer:
    saving_folder: .
    timestamp_file: timestamps.txt

# ==============================================================
# inference   (lerobot_eval_ros2)
# ==============================================================
inference:
  frequency_hz: 10
  policy_inferences:
    <policy_name>:
      device: cuda
      observation_state_size: -1
      zero_observation_state: true
      # Supported Policies:
      # - diffusion
      # - act
      # - dit_flow
      policy_type: ''
      pretrained_policy_path: ''
      # One or more output routes.
      # Use multiple outputs for action slicing.
      action_outputs:
      - name: default
        # Optional [start, end) slice into the action.
        # None means the full action.
        action_slice: null
        robot_processor:
          pose_topic: ''
          # Supported pose topic types: twist_stamped, pose_stamped
          pose_topic_type: none
          jaw_topic: ''
          # Supported jaw topic types: joy, joint, joint_state
          jaw_topic_type: none
          position_increment_scale: 1.0
          rotation_increment_scale: 1.0
          action_type: xyz_quat
          # Row-major flattened 3x3 rotation matrix applied to xyz before publishing. None to skip.
          base_to_cam_rotation: null

# ==============================================================
# data_conversion   (data_conversion)
# ==============================================================
data_conversion:
  raw_dir: null
  out_dir: null
  image_type: png
  state: zero
  robot_env: Unity
  repo_id: local/franka_pushblock
  push: false
  fps: 20
  # Comma-separated camera indices to include (e.g. "0,2").
  cameras: null
  # Comma-separated camera folder names (e.g. "cam0,cam2").
  cam_names: null
  task: pushblock
  # Single-action configuration. Overridden when action_sources is provided.
  action_source:
    eef_file: eef_position.txt
    jaw_file: null
    jaw: none
    action: xyz
    transform_matrix: null
    absolute_xyz: false
    absolute_quat: false
    absolute_jaw: false
    # Optional 3x3 rotation matrix to transform xyz action from base frame to camera frame (inverse applied).
    base_to_cam_rot: null
  # Optional list of multiple actions to concatenate (overrides single action configs).
  action_sources:
  - eef_file: eef_position.txt
    jaw_file: null
    jaw: none
    action: xyz
    transform_matrix: null
    absolute_xyz: false
    absolute_quat: false
    absolute_jaw: false
    # Optional 3x3 rotation matrix to transform xyz action from base frame to camera frame (inverse applied).
    base_to_cam_rot: null

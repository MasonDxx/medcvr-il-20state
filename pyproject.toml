[project]
name = "medcvr-il"
version = "0.1.0"
description = "ROS2 data collection and inference helpers for medcvr-il."
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot",
    "numpy==2.2.6",
    "omegaconf==2.3.0",
    "opencv-python-headless==4.12.0.88",
    "Pillow>=10.0.0",
    "pyyaml==6.0.3",
    "scipy>=1.15.3",
    "tyro==1.0.6",
]

[tool.uv]
package = true

[tool.uv.sources]
lerobot = { path = "./lerobot", editable = true }

[tool.setuptools.packages.find]
include = ["medcvr_il*"]

[dependency-groups]
dev = [
    "lark>=1.3.1",
    "pytest>=9.0.3",
]
